[workspace]
release = false
release_always = false
changelog_update = false
pr_labels = ["release"]
max_analyze_commits = 2000

[[package]]
name = "use-config-key"
release = true
version_group = "rustuse-config"

[[package]]
name = "use-config-value"
release = true
version_group = "rustuse-config"

[[package]]
name = "use-config-source"
release = true
version_group = "rustuse-config"

[[package]]
name = "use-config-layer"
release = true
version_group = "rustuse-config"

[[package]]
name = "use-config-profile"
release = true
version_group = "rustuse-config"

[[package]]
name = "use-config-secret"
release = true
version_group = "rustuse-config"

[[package]]
name = "use-config"
release = true
version_group = "rustuse-config"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = [
  "use-config-key",
  "use-config-value",
  "use-config-source",
  "use-config-layer",
  "use-config-profile",
  "use-config-secret",
]

[changelog]
header = """# Changelog

## Unreleased
"""
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat(?:\\([^)]+\\))?!?: .+", group = "Added" },
  { message = "^fix(?:\\([^)]+\\))?!?: .+", group = "Fixed" },
  { message = "^security(?:\\([^)]+\\))?!?: .+", group = "Security" },
  { message = "^(?:refactor|perf|change)(?:\\([^)]+\\))?!?: .+", group = "Changed" },
  { message = "^docs(?:\\([^)]+\\))?!?: .+", group = "Documentation" },
  { message = "^(?:build|ci|chore|deps|test)(?:\\([^)]+\\))?!?: .+", group = "Tooling" },
  { footer = "^changelog: ?ignore$", skip = true },
  { message = "^.*", group = "Changed" },
]
